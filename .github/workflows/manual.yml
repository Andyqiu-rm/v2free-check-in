name: V2freeCheckin

on:
  workflow_dispatch:
  
  schedule:
    # UTC: Beijing 07:00,12:00
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"

concurrency:
  group: v2freecheckin
  cancel-in-progress: false

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  issues: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'


    - name: Install Python
      run: |
        sudo apt update && \
        sudo apt install python3
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install urllib3==1.26.20 requests==2.31.0 six
        
    - name: Checkin
      run: |
        user='${{ secrets.USER }}'
        pwd='${{ secrets.PWD }}'
        remail='${{secrets.remail}}'        
        semail='${{secrets.semail}}'
        secode='${{secrets.secode}}'
        
        user_list=()
        pwd_list=()
        IFS=","
        for u in ${user[*]}
        do
        user_list[${#user_list[*]}]=${u}
        done
        for p in ${pwd[*]}
        do
        pwd_list[${#pwd_list[*]}]=${p}
        done
        user_num=${#user_list[*]}
        pwd_num=${#pwd_list[*]}
        if [ $user_num != $pwd_num ];then
        echo "账号和密码个数不对应"
        exit 1
        else
        echo "共有 $user_num 个账号，即将开始签到"
        fi
        for ((i=0;i<$user_num;i++))
        do
        python3 main.py --username ${user_list[$i]} --password ${pwd_list[$i]} --remail=${remail} --semail=${semail} --secode=${secode}
        done

    - name: Commit run.log
      if: always()
      run: |
        if [ -f run.log ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f run.log
          if git diff --cached --quiet; then
            echo "run.log 无变化"
          else
            # 根据本次新增日志判断结果：只要有一条 ❌ 就算失败
            if git diff --cached -- run.log | grep -q '^+.*❌'; then
              commit_msg="❌ 签到失败"
            else
              commit_msg="⭐ 签到成功"
            fi
            echo "本次提交信息：$commit_msg"
            git commit -m "$commit_msg"
            # push 被拒（远程有新提交）时：备份本次日志 -> 放弃本地提交 -> 拉取远程 -> 追加新行 -> 重新提交
            if ! git push; then
              echo "push 被拒，处理并发冲突"
              cp run.log /tmp/run.log.mine
              git reset --hard HEAD~1
              git pull --rebase origin "${{ github.ref_name }}" || git pull origin "${{ github.ref_name }}"
              # 把本次新增、远程还没有的日志行追加回去（整行匹配去重）
              grep -Fxv -f run.log /tmp/run.log.mine >> run.log || true
              git add -f run.log
              if git diff --cached --quiet; then
                echo "run.log 无新增内容"
              else
                git commit -m "$commit_msg"
                git push || echo "重试推送仍失败，跳过本次日志提交"
              fi
            fi
          fi
        else
          echo "run.log 未生成"
        fi

    - name: Show run.log
      if: always()
      run: cat run.log || echo "run.log 不存在"


