name: V2freeCheckin

on:
  workflow_dispatch:
  schedule:
    # 已指定 Asia/Shanghai，下面 cron 直接按北京时间解释，不用减 8 小时
    # Beijing 07:07,10:07,and 15：07
    - cron: '7 7 * * *'
      timezone: Asia/Shanghai
    - cron: '7 11 * * *'
      timezone: Asia/Shanghai
    - cron: '7 15 * * *'
      timezone: Asia/Shanghai

concurrency:
  group: v2freecheckin
  cancel-in-progress: false
  queue: max

permissions:
  contents: write


jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'


    - name: Install Python
      run: |
        sudo apt update && \
        sudo apt install python3
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Checkin
      run: |
        user='${{ secrets.USER }}'
        pwd='${{ secrets.PWD }}'
        remail='${{ secrets.remail }}'
        semail='${{ secrets.semail }}'
        secode='${{ secrets.secode }}'

        # 账号与密码个数校验（逗号分隔）
        IFS="," read -ra user_list <<< "$user"
        IFS="," read -ra pwd_list <<< "$pwd"
        user_num=${#user_list[@]}
        pwd_num=${#pwd_list[@]}
        if [ "$user_num" != "$pwd_num" ]; then
          echo "账号和密码个数不对应"
          exit 1
        fi
        echo "共有 $user_num 个账号，即将开始签到"

        # 所有账号一次传入，脚本内部签到完后只发一封汇总邮件
        python main.py --usernames="$user" --passwords="$pwd" --remail="$remail" --semail="$semail" --secode="$secode"

    - name: Commit run.log
      if: always()
      run: |
        if [ -f run.log ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f run.log
          if git diff --cached --quiet; then
            echo "run.log 无变化"
          else
            # 根据本次新增日志判断结果：只要有一条 ❌ 就算失败
            if git diff --cached -- run.log | grep -q '^+.*❌'; then
              commit_msg="❌ 签到失败"
            else
              commit_msg="⭐ 签到成功"
            fi
            echo "本次提交信息：$commit_msg"
            git commit -m "$commit_msg"
            # push 被拒（远程有新提交）时：备份本次日志 -> 放弃本地提交 -> 拉取远程 -> 追加新行 -> 重新提交
            if ! git push; then
              echo "push 被拒，处理并发冲突"
              cp run.log /tmp/run.log.mine
              git reset --hard HEAD~1
              git pull --rebase origin "${{ github.ref_name }}" || git pull origin "${{ github.ref_name }}"
              # 把本次新增、远程还没有的日志行追加回去（整行匹配去重）
              grep -Fxv -f run.log /tmp/run.log.mine >> run.log || true
              git add -f run.log
              if git diff --cached --quiet; then
                echo "run.log 无新增内容"
              else
                git commit -m "$commit_msg"
                git push || echo "重试推送仍失败，跳过本次日志提交"
              fi
            fi
          fi
        else
          echo "run.log 未生成"
        fi

    - name: Show run.log
      if: always()
      run: cat run.log || echo "run.log 不存在"

    # 心跳保活：每次运行都提交一次 .keepalive，让仓库保持活跃，降低定时任务被暂停的风险
    - name: Keepalive (.keepalive)
      if: always()
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        date -u '+%F %T UTC' > .keepalive
        git add -f .keepalive
        if git diff --cached --quiet; then
          echo "心跳文件未变化，跳过提交"
        else
          git commit -m "chore: heartbeat [skip ci]"
          # push 被拒（远程有新提交）时 rebase 后重试，避免与 run.log 提交冲突
          if ! git push; then
            echo "心跳 push 被拒，rebase 后重试"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || echo "心跳推送失败，跳过"
          fi
        fi
