name: V2freeCheckin

on:
  workflow_dispatch:
  schedule:
    # 已指定 Asia/Shanghai，下面 cron 直接按北京时间解释，不用减 8 小时
    # Beijing 07:07,10:07,and 15：07
    - cron: '7 7 * * *'
      timezone: Asia/Shanghai
    - cron: '7 11 * * *'
      timezone: Asia/Shanghai
    - cron: '7 15 * * *'
      timezone: Asia/Shanghai

concurrency:
  group: v2freecheckin
  cancel-in-progress: false
  queue: max

permissions:
  contents: write


jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Checkin
      env:
        V2_USER: ${{ secrets.USER }}
        V2_PWD: ${{ secrets.PWD }}
        V2_REMAIL: ${{ secrets.remail }}
        V2_SEMAIL: ${{ secrets.semail }}
        V2_SECODE: ${{ secrets.secode }}
      run: |
        user="$V2_USER"
        pwd="$V2_PWD"
        remail="$V2_REMAIL"
        semail="$V2_SEMAIL"
        secode="$V2_SECODE"

        # 账号与密码个数校验（逗号分隔）
        IFS="," read -ra user_list <<< "$user"
        IFS="," read -ra pwd_list <<< "$pwd"
        user_num=${#user_list[@]}
        pwd_num=${#pwd_list[@]}
        if [ "$user_num" != "$pwd_num" ]; then
          echo "账号和密码个数不对应"
          exit 1
        fi
        echo "共有 $user_num 个账号，即将开始签到"

        # 记录账号数与签前日志行数，供后面的作业摘要精确取出本次新增明细
        echo "SUMMARY_USER_NUM=$user_num" >> "$GITHUB_ENV"
        summary_start=0
        [ -f run.log ] && summary_start=$(wc -l < run.log)
        echo "SUMMARY_START_LINE=$summary_start" >> "$GITHUB_ENV"

        # 所有账号一次传入，脚本内部签到完后只发一封汇总邮件
        python main.py --usernames="$user" --passwords="$pwd" --remail="$remail" --semail="$semail" --secode="$secode"

    - name: Commit run.log
      if: always()
      run: |
        if [ -f run.log ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f run.log
          if git diff --cached --quiet; then
            echo "run.log 无变化"
          else
            # 根据本次新增日志判断结果：只要有一条 ❌ 就算失败
            if git diff --cached -- run.log | grep -q '^+.*❌'; then
              commit_msg="❌ 签到失败"
            else
              commit_msg="⭐ 签到成功"
            fi
            echo "本次提交信息：$commit_msg"
            git commit -m "$commit_msg"
            # push 被拒（远程有新提交）时：备份本次日志 -> 放弃本地提交 -> 拉取远程 -> 追加新行 -> 重新提交
            if ! git push; then
              echo "push 被拒，处理并发冲突"
              cp run.log /tmp/run.log.mine
              git reset --hard HEAD~1
              git pull --rebase origin "${{ github.ref_name }}" || git pull origin "${{ github.ref_name }}"
              # 把本次新增、远程还没有的日志行追加回去（整行匹配去重）
              grep -Fxv -f run.log /tmp/run.log.mine >> run.log || true
              git add -f run.log
              if git diff --cached --quiet; then
                echo "run.log 无新增内容"
              else
                git commit -m "$commit_msg"
                git push || echo "重试推送仍失败，跳过本次日志提交"
              fi
            fi
          fi
        else
          echo "run.log 未生成"
        fi

    - name: Show run.log
      if: always()
      run: cat run.log || echo "run.log 不存在"

    - name: Write job summary
      if: always()
      run: |
        {
          echo "### V2Free 签到结果"
          echo ""
          echo "- 运行时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "- 触发方式：${{ github.event_name }}"
          echo "- 运行编号：#${{ github.run_number }}"
          echo "- 账号数量：${SUMMARY_USER_NUM:-未知}"
          echo ""
          start=${SUMMARY_START_LINE:-0}
          if [ -s run.log ]; then
            echo "<details open><summary>本次签到明细（邮箱已脱敏）</summary>"
            echo ""
            echo '```text'
            tail -n +$((start + 1)) run.log
            echo '```'
            echo ""
            echo "</details>"
          else
            echo "> 本次未生成 run.log，请检查 Checkin 步骤日志。"
          fi
        } >> "$GITHUB_STEP_SUMMARY"    
