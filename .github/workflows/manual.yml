name: V2freeCheckin

on:
  workflow_dispatch:
  schedule:
    # UTC: Beijing 07:00,12:00
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    
permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  issues: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'


    - name: Install Python
      run: |
        sudo apt update && \
        sudo apt install python3
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install urllib3==1.26.20 requests==2.31.0 six
        
    - name: Checkin
      run: |
        user='${{ secrets.USER }}'
        pwd='${{ secrets.PWD }}'
        remail='${{secrets.remail}}'        
        semail='${{secrets.semail}}'
        secode='${{secrets.secode}}'
        
        user_list=()
        pwd_list=()
        IFS=","
        for u in ${user[*]}
        do
        user_list[${#user_list[*]}]=${u}
        done
        for p in ${pwd[*]}
        do
        pwd_list[${#pwd_list[*]}]=${p}
        done
        user_num=${#user_list[*]}
        pwd_num=${#pwd_list[*]}
        if [ $user_num != $pwd_num ];then
        echo "账号和密码个数不对应"
        exit 1
        else
        echo "共有 $user_num 个账号，即将开始签到"
        fi
        for ((i=0;i<$user_num;i++))
        do
        python3 main.py --username ${user_list[$i]} --password ${pwd_list[$i]} --remail=${remail} --semail=${semail} --secode=${secode}
        done

    - name: Commit run.log
      if: always()
      run: |
        if [ -f run.log ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f run.log
          if git diff --cached --quiet; then
            echo "run.log 无变化"
          else
            git commit -m "action" -m "⭐ 签到成功 [skip ci]"
            git push || (git pull --rebase && git push)
          fi
        else
          echo "run.log 未生成"
        fi

    - name: Show run.log
      if: always()
      run: cat run.log || echo "run.log 不存在"


